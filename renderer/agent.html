<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Agen Pulau</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="agent.css">
</head>
<body>
<div class="tb"><span>Agen Pulau</span></div>
<main>
  <div class="stat"><i id="dot"></i><div><b id="stTitle">Siap</b><span id="stSub">Tulis tugas di bawah lalu tekan Mulai.</span></div></div>
  <div class="goal">
    <textarea id="goal" rows="3" placeholder="Apa yang ingin dikerjakan agen? Contoh: Buka Notepad dan tulis daftar belanja."></textarea>
    <div class="btns">
      <button id="go" class="pri">Mulai</button>
      <button id="stop" class="danger" hidden>Berhenti</button>
      <span class="hint">Ctrl+Enter mulai · Ctrl+Alt+X berhenti darurat</span>
    </div>
  </div>
  <div id="ask" class="ask" hidden>
    <b id="askKind"></b>
    <p id="askText"></p>
    <div id="askInput" class="ask-in" hidden><input id="askField" type="text" placeholder="Jawaban Anda"><button id="askSend" class="pri">Kirim</button></div>
    <div id="askBtns" class="btns"><button id="askYes" class="pri">Izinkan</button><button id="askNo">Tolak</button></div>
  </div>
  <div id="log" class="log"></div>
  <div class="foot"><span id="meta">Langkah 0 · 0 token</span></div>
</main>
<script src="js/agentwin.js"></script>
</body>
</html>
